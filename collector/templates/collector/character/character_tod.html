{%load fics_filters%}
{%load static%}

{% if  c.tourofduty_set.count != 0 %}
<h5>Lifepaths</h5>
<p>
{% for tod in c.tourofduty_set.all %}

{{ tod.ref.reference|safe }}
({{ tod.ref.value }}){%if forloop.last %}.{%else%}, {%endif%}
{% endfor %}
</p>
{% endif %}
