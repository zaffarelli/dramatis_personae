<table class='custo'>
	<tr>
		<th num=1><span id='ba_add' class='edit_icon fa fa-arrow-alt-circle-left'></span></th>
		<th num=2>Add B/A</th>
        <td num=3>
			<select id='ba_select'>
			{% for s in c.ba_options %}
				<option value='{{s.id}}' style='width:15ex;'>{{s.reference}} ({{s.value}})</option>
			{% endfor %}
			</select>
        </td>
	</tr>
	<tr>
		<th num=1><span id='ba_del' class='edit_icon fa fa-arrow-alt-circle-right'></span></th>
		<th num=2>Remove B/A</th>
        <td num=3>
            {% if c.ba_options_not %}
			<select id='ba_unselect'>
			{% for s in c.ba_options_not %}
				<option value='{{s.id}}' style='width:15ex;'>{{s.reference}} ({{s.value}})</option>
			{% endfor %}
			</select>
            {% else %}
            Nothing to remove
            {% endif %}
        </td>
	</tr>
</table>
